        <text x="150.733px" y="261.917px" style="font-family:'HaranoAjiGothic-Regular', 'Harano Aji Gothic', sans-serif;font-size:30px;">f<tspan x="160.153px " y="261.917px ">o</tspan>r i in 0 .. (n-1) do　　←100本の線分を生成</text>
